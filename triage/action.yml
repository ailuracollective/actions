name: 'Issue triage'
description: >-
  Apply a triage label to newly opened issues, so incoming work is visibly queued rather than
  sitting unlabeled.
author: 'ailuracollective'

# Its own action because it is the only check that runs on the `issues` stream rather than on a pull
# request, and the only one that needs `issues: write`. A consumer validating pull requests should not
# have to grant it.

inputs:
  auto-label-name:
    description: Label applied to a newly opened issue.
    required: false
    default: 'status:needs-review'
  github-token:
    description: Token used for the label write. Defaults to the workflow's own token.
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Auto-label issue
      continue-on-error: true
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        INPUT_AUTO_LABEL_NAME: ${{ inputs.auto-label-name }}
        # prv_gate filters on the event action as well as the event name, and this is a context
        # value rather than a runner default: GitHub exposes GITHUB_EVENT_NAME and GITHUB_EVENT_PATH,
        # not GITHUB_EVENT_ACTION. Unset under `set -u` it kills the check before it records anything.
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
      run: bash ${{ github.action_path }}/auto-label.sh

    - name: Report
      if: always()
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        # The key this report step owns a sticky comment under, declared like the other two actions'
        # so the three reports are configured identically. It cannot publish here: the comment is
        # written on a `pull_request` event only, and this action runs on `issues`, where there is no
        # pull request conversation to comment in.
        PRV_ACTION: 'triage'
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PRV_TITLE: 'Issue triage'
        PRV_CHECKS: 'auto-label'
        PRV_LABELS: 'Auto-label issue'
      run: bash ${{ github.action_path }}/../lib/report.sh

# Marketplace listing metadata. `color` accepts only nine named values — white, black,
# yellow, blue, green, orange, red, purple, gray-dark — not a hex code. `icon` must be a
# Feather v4.28.0 name, excluding coffee, columns, divide, divide-circle, divide-square,
# frown, hexagon, key, meh, mouse-pointer, smile, tool and x-octagon.
branding:
  icon: 'tag'
  color: 'orange'
