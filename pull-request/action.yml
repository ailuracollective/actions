name: 'Pull request policy'
description: 'Enforce a contribution policy on a pull request: linked issue, type label, title and body. Every finding in one run.'
author: 'ailuracollective'

# Five checks, one status. The rules are independent, so branch protection can require each — except
# that a composite action cannot, which is why the run reports all five at once and the job summary
# carries the table. Branch naming is a separate action.

inputs:
  enable-linked-issue:
    description: Require a closing keyword in the PR body pointing at an issue that carries the approved label.
    required: false
    default: 'true'
  enable-type-label:
    description: Require exactly one of the allowed type labels on the PR.
    required: false
    default: 'true'
  enable-title-length:
    description: Require the PR title to fall inside the character window.
    required: false
    default: 'true'
  enable-title-conventional:
    description: Require the PR title to be a Conventional Commit subject.
    required: false
    default: 'true'
  enable-body-structure:
    description: Require every section declared by the type template to be present in the PR body.
    required: false
    default: 'true'
  title-min:
    description: Minimum PR title length, in characters.
    required: false
    default: '15'
  title-max:
    description: Maximum PR title length, in characters.
    required: false
    default: '72'
  type-labels:
    description: Comma-separated labels a pull request must carry exactly one of. Read only by the label check, so these must be label names the repository actually has.
    required: false
    default: 'feat,fix,docs,refactor,chore,style,perf,test,build,ci,revert,breaking-change'
  title-types:
    description: 'Comma-separated Conventional Commit types allowed in the PR title and used to resolve its template. Leave empty when the label vocabulary and the title vocabulary are the same, which is the default. Set it when they differ — for example `type-labels: type/feature,type/bug,…` with `title-types: feat,fix,…` — because the two sets have different sizes and cannot be one input.'
    required: false
    default: ''
  template-dir:
    description: Directory holding the per-type PR templates.
    required: false
    default: '.github/PULL_REQUEST_TEMPLATE'
  default-template:
    description: PR template used for a type that has no dedicated template.
    required: false
    default: '.github/PULL_REQUEST_TEMPLATE.md'
  approved-label:
    description: Label a linked GitHub issue must carry for the PR to pass.
    required: false
    default: 'status:approved'
  linked-issue-sources:
    description: 'Comma-separated sources the closing reference may point at: `github` for #N, `linear` for TEAMKEY-N.'
    required: false
    default: 'github'
  linear-approved-label:
    description: Label a linked Linear issue must carry for the PR to pass.
    required: false
    default: 'approved'
  skip-actors:
    description: 'Comma-separated GitHub logins whose pull requests are exempt from every check in this action. Each entry is matched literally, as a whole login, case-insensitively — never as a pattern. An exempt pull request is reported as skipped, not passed.'
    required: false
    default: ''
  enable-status-comment:
    description: 'Keep a single comment on the pull request carrying this action''s current status, updated on every run instead of a new comment per run. Needs `pull-requests: write` on the calling job; set this to `false` to publish nothing.'
    required: false
    default: 'true'
  comment-author:
    description: 'Login that must own the status comment, compared case-insensitively against the token''s own account. A comment is authored by whoever holds the token that writes it, so the workflow''s own token would post as `github-actions[bot]`; give the report a token for this login in `comment-token` so the comment belongs to the organisation. Nothing is published under a different identity.'
    required: false
    default: 'AiluraKitty'
  comment-token:
    description: 'Token the status comment is published with, which need not be the one the checks read with. Defaults to `github-token`. Set it when the comment has to be authored by an organisation account: a write-scoped personal access token is then handed to the report alone and never to a check script.'
    required: false
    default: ''
  github-token:
    description: Token used for every API call the checks make. Defaults to the workflow's own token.
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Linked issue
      if: inputs.enable-linked-issue == 'true'
      continue-on-error: true
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        INPUT_SKIP_ACTORS: ${{ inputs.skip-actors }}
        # The PR author, the identity the exemption list is matched against.
        AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        INPUT_APPROVED_LABEL: ${{ inputs.approved-label }}
        INPUT_LINKED_ISSUE_SOURCES: ${{ inputs.linked-issue-sources }}
        INPUT_LINEAR_APPROVED_LABEL: ${{ inputs.linear-approved-label }}
        # A secret, not an input: a `with:` value is echoed into the step's rendered command, an env
        # value is not. Read straight from the environment so the caller passes it as a secret.
        LINEAR_API_KEY: ${{ env.LINEAR_API_KEY }}
        # Untrusted body: passed through the environment, never spliced into a script.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: bash ${{ github.action_path }}/linked-issue.sh

    - name: Type label
      if: inputs.enable-type-label == 'true'
      continue-on-error: true
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        INPUT_SKIP_ACTORS: ${{ inputs.skip-actors }}
        AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        INPUT_TYPE_LABELS: ${{ inputs.type-labels }}
        # Untrusted labels: one JSON array, filtered with jq inside the script.
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
      run: bash ${{ github.action_path }}/type-label.sh

    - name: Title length
      if: inputs.enable-title-length == 'true'
      continue-on-error: true
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        INPUT_SKIP_ACTORS: ${{ inputs.skip-actors }}
        AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        INPUT_TITLE_MIN: ${{ inputs.title-min }}
        INPUT_TITLE_MAX: ${{ inputs.title-max }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: bash ${{ github.action_path }}/pr-title-length.sh

    - name: Title follows Conventional Commits
      if: inputs.enable-title-conventional == 'true'
      continue-on-error: true
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        INPUT_SKIP_ACTORS: ${{ inputs.skip-actors }}
        AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        INPUT_TYPE_LABELS: ${{ inputs.type-labels }}
        INPUT_TITLE_TYPES: ${{ inputs.title-types }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: bash ${{ github.action_path }}/pr-title-conventional.sh

    - name: Body structure
      if: inputs.enable-body-structure == 'true'
      continue-on-error: true
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        INPUT_SKIP_ACTORS: ${{ inputs.skip-actors }}
        AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        # Base branch, never the PR head: on a fork pull request `github.sha` is attacker-controlled,
        # and a job holding a token must not put untrusted fork code on the runner.
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        INPUT_TYPE_LABELS: ${{ inputs.type-labels }}
        INPUT_TITLE_TYPES: ${{ inputs.title-types }}
        INPUT_TEMPLATE_DIR: ${{ inputs.template-dir }}
        INPUT_DEFAULT_TEMPLATE: ${{ inputs.default-template }}
      run: bash ${{ github.action_path }}/pr-body-structure.sh

    - name: Report
      if: always()
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        # The sticky comment this action owns. One key per action, and the only thing that tells the
        # PR policy's comment from the branch validation comment: each action updates its own and
        # never another's, so a pull request carries one status board per action.
        PRV_ACTION: 'pull-request'
        PRV_PUBLISH_COMMENT: ${{ inputs.enable-status-comment }}
        # Who the comment must be written as. A comment is authored by the owner of the token that
        # writes it, so this is the input that makes the comment Ailura Kitty's and not the
        # workflow's; the report refuses to publish under any other identity rather than posting one
        # the organisation does not own.
        PRV_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        # Where the comment lands, and with what. `PR_NUMBER` is not a runner default. The writing
        # token is a separate input from the reading one because the checks only ever read: it is
        # the one place a write-scoped token is needed, and it has no reason to be in the hands of
        # anything that only has to look. Falls back to `github-token`, so a caller that has no
        # opinion about authorship changes nothing.
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.comment-token || inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PRV_TITLE: 'Pull request policy'
        PRV_CHECKS: 'linked-issue|type-label|pr-title-length|pr-title-conventional|pr-body-structure'
        PRV_LABELS: 'Linked issue|Type label|Title length|Title is conventional|Body structure'
      run: bash ${{ github.action_path }}/../lib/report.sh

# Marketplace listing metadata. `color` accepts only nine named values — white, black,
# yellow, blue, green, orange, red, purple, gray-dark — not a hex code. `icon` must be a
# Feather v4.28.0 name, excluding coffee, columns, divide, divide-circle, divide-square,
# frown, hexagon, key, meh, mouse-pointer, smile, tool and x-octagon.
branding:
  icon: 'git-pull-request'
  color: 'green'
