name: 'Branch validation'
# Under 125 characters, because the Marketplace rejects a longer one at publish time.
description: 'Require a pull request''s head branch to read <author>/<type>/<description> and to be owned by its author.'
author: 'ailuracollective'

# One check, deliberately: the other contribution-policy checks are separate actions, because a
# consumer that only wants branch naming should not have to opt out of five others, and should not
# need a token at all.
#
# The check itself needs no token, and that is the point of separating it out. Publishing its status
# comment does need one, because a comment is a write, so that comment is off by default here:
# `enable-status-comment: true` turns it on, and then the calling job needs `pull-requests: write`.
# The checks behave identically either way.

inputs:
  branch-types:
    description: Comma-separated type segments accepted in a branch name.
    required: false
    default: 'feat,fix,chore,docs,style,refactor,perf,test,build,ci,revert'
  skip-actors:
    description: 'Comma-separated GitHub logins whose pull requests are exempt from this check. Each entry is matched literally, as a whole login, case-insensitively — never as a pattern. An exempt pull request is reported as skipped, not passed.'
    required: false
    default: ''
  enable-status-comment:
    description: 'Keep a single comment on the pull request carrying this action''s current status, updated on every run instead of a new comment per run. Needs `pull-requests: write` on the calling job. Off by default, because the check itself needs no token and this action exists so that a consumer who only wants branch naming grants nothing.'
    required: false
    default: 'false'
  comment-author:
    description: 'Login that must own the status comment, compared case-insensitively against the token''s own account. A comment is authored by whoever holds the token that writes it, so the workflow''s own token would post as `github-actions[bot]`; give the report a token for this login in `comment-token` so the comment belongs to the organisation. Nothing is published under a different identity.'
    required: false
    default: 'AiluraKitty'
  comment-token:
    description: 'Token the status comment is published with. Defaults to `github-token`. This action reads nothing itself, so `comment-token` is the only token that has to be able to write.'
    required: false
    default: ''
  github-token:
    description: Token used for every API call the checks make. Defaults to the workflow's own token.
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    # Records a verdict and exits 0; `continue-on-error` is what keeps a crash from skipping the rest,
    # and the report step is what actually fails the job. Without aggregation a single check status
    # would cost the author one push per defect.
    - name: Branch name
      continue-on-error: true
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        INPUT_BRANCH_TYPES: ${{ inputs.branch-types }}
        INPUT_SKIP_ACTORS: ${{ inputs.skip-actors }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # The PR AUTHOR, not the head ref owner: for a fork PR they are different people.
        AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        # prv_gate filters on the event action as well as the event name. This is a context value
        # passed like every other one here, not a runner default: GitHub exposes GITHUB_EVENT_NAME
        # and GITHUB_EVENT_PATH, not GITHUB_EVENT_ACTION, and an unset variable under `set -u` kills
        # the check before it can record a verdict.
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
      run: bash ${{ github.action_path }}/branch-name.sh

    - name: Report
      # `always()`: the report must render even when the check crashed, and a step that failed under
      # `continue-on-error` would otherwise skip every step after it.
      if: always()
      shell: bash
      env:
        RESULTS_DIR: ${{ runner.temp }}/prv-results
        GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        # Its own sticky comment, separate from the PR policy's: the marker names this action, so one
        # action never overwrites another's status.
        PRV_ACTION: 'branch-validation'
        PRV_PUBLISH_COMMENT: ${{ inputs.enable-status-comment }}
        PRV_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # The comment is the only thing here that writes, so it is the only thing that gets a token
        # with any business writing. Falls back to `github-token` when nobody named one.
        GH_TOKEN: ${{ inputs.comment-token || inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        # Titles the one action that ran.
        PRV_TITLE: 'Branch validation'
        PRV_CHECKS: 'branch-name'
        PRV_LABELS: 'Branch name'
        PRV_NOTE: 'This check runs on `opened` only. GitHub cannot rename a branch an open pull request points at, so `head.ref` is fixed for the life of the pull request; re-validating it on every event would spend runner minutes re-deriving a fact that cannot have changed.'
      run: bash ${{ github.action_path }}/../lib/report.sh

# Marketplace listing metadata. `color` accepts only nine named values — white, black,
# yellow, blue, green, orange, red, purple, gray-dark — not a hex code. `icon` must be a
# Feather v4.28.0 name, excluding coffee, columns, divide, divide-circle, divide-square,
# frown, hexagon, key, meh, mouse-pointer, smile, tool and x-octagon.
branding:
  icon: 'git-branch'
  color: 'blue'
