name: Self validation

# A directory path, not `@v1`: the pull request is judged by the code it contains, so a break fails its
# own run. The published tag is untested here; that is what a release smoke test is for.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  issues:
    types: [opened]

# A fork pull request would put its head on the runner beside a token, which this repository's own
# README forbids for forks. Set here so all three jobs agree rather than repeating the condition.
permissions: {}

concurrency:
  group: self-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-validation:
    name: Branch name
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # `permissions: {}` would be right for the check alone: it reads nothing from the API, which is
    # why its status comment is off by default. It is turned on here for the one thing layer 3 can
    # test and the offline suite can only fake — two actions, two comments, on one real pull request,
    # each updating only the one its own marker names. Fork pull requests never reach either job.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Seven, and it is a TITLE vocabulary rather than a label one: a branch segment is the
      # Conventional Commit type. Same list as `title-types` below.
      - uses: ./branch-validation
        with:
          branch-types: feat,fix,docs,chore,ci,test,refactor
          enable-status-comment: true

  pr-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # `contents: read` is what lets the body-structure check read the template off the base branch,
    # and `pull-requests: write` is the status comment — a write the checks themselves never need,
    # which is why this job's own comment is posted by the action rather than by the workflow.
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # All five at their defaults. A disabled check cannot fail, and a check that never fails is
      # not being tested.
      - uses: ./pull-request
        with:
          # This repository carries the prefixed `type/*` family, like every other in the
          # organisation — the bare names the bootstrap workflow creates are a leftover from
          # before the family was adopted, and none of them exists on the remote. Declaring a
          # label that does not exist is not a stricter gate, it is an unsatisfiable one: the
          # check matches by exact, case-folded name, so every pull request was reported as
          # carrying no type label at all.
          type-labels: type/feature,type/bug,type/documentation,type/improvement,type/task
          # Declared separately because it is a different set of a different size: these are the
          # Conventional Commit types, which is what a title and a branch segment carry. It falls
          # back to `type-labels` when empty, and inheriting here would make the grammar demand a
          # literal `type/feature:` subject.
          title-types: feat,fix,docs,chore,ci,test,refactor
          title-min: 15
          title-max: 72
          linked-issue-sources: github
          # `status/ready`, with the slash: the status family uses slash names and the remote
          # carries `status/ready`. `status:approved` was never created on any remote in this
          # organisation, so the linked-issue gate demanded a label nothing could ever carry.
          approved-label: status/ready

  root-index:
    name: Root index refuses adoption
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `continue-on-error`: the index is meant to fail, so the job asserts the failure instead of
      # dying on it. No permissions are needed because the index reads nothing and calls no API.
      - id: index
        continue-on-error: true
        uses: ./
      # The step outcome is the property. The pointer is checked by replaying the index's own inline
      # step body, because a composite step exposes no output to read the rendered `::error` from.
      - name: The index fails and points at a real action
        shell: bash
        run: |
          if [ '${{ steps.index.outcome }}' != failure ]; then
            printf '::error::the root index was adopted and did not fail; it must refuse adoption\n'
            exit 1
          fi
          sed -n '/^      run: |$/,/^$/p' action.yml | sed '1d' > "$RUNNER_TEMP/index-step.sh"
          set +e
          output=$(bash "$RUNNER_TEMP/index-step.sh" 2>&1)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            printf '::error::the index step must exit non-zero; it exited 0\n'
            exit 1
          fi
          case $output in
            *branch-validation*) ;;
            *)
              printf '::error::the index error must name branch-validation; got: %s\n' "$output"
              exit 1
              ;;
          esac

  triage:
    name: Issue triage
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    # The only job here that writes, and the only grant of `issues: write`. It runs from the default
    # branch, so `./triage` is this repository's own code by construction.
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./triage
        with:
          auto-label-name: status/needs-review
