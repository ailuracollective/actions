name: Checks

# Judges the change. Does not exercise the change as an action; `self-validation.yml` does that.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Check suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run every check against the offline stubs
        run: bash tests/run-checks.sh

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Pinned by version and digest: a required status that flips when GitHub ships a new image is a
      # status nobody trusts. ShellCheck publishes no checksum file, so this digest is the tarball's.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      # From git, so an untracked script cannot quietly bypass the gate.
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files -z '*.sh' | tr '\0' '\n')
          shellcheck -x "${scripts[@]}"

      - name: Install yamllint
        run: python3 -m pip install --quiet 'yamllint==1.38.0'

      - name: yamllint
        run: |
          set -euo pipefail
          mapfile -t yamls < <(git ls-files -z '*.yml' '*.yaml' | tr '\0' '\n')
          "$(python3 -m site --user-base)/bin/yamllint" --strict "${yamls[@]}"

      # The one linter that reads `${{ }}` expressions, event contexts, and `needs`/`if`. Also runs
      # shellcheck over the `run:` blocks above.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin actionlint

      - name: actionlint
        run: actionlint -color
